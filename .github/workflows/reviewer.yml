name: OpenRabbit Reviewer

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: OpenRabbit
        uses: aryanbrite/openrabbit@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.ZHIPU_API_KEY }}
          llm_provider: openrouter
          llm_api_url: https://api.z.ai/api/paas/v4
          llm_model: glm-4.5-flash
          review_mode: both
          tone_mode: balanced
