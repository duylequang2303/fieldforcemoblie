name: fieldforce_mobile
description: "Ứng dụng Flutter di động dành cho Nhân viên Thực địa (Worker) kết nối Odoo Field Service Management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Odoo API Client ──────────────────────────────────
  odoo_rpc: ^0.5.0
  http: ^1.2.0

  # ── State Management ─────────────────────────────────
  provider: ^6.1.2

  # ── Routing ──────────────────────────────────────────
  go_router: ^14.2.0

  # ── Offline Storage ───────────────────────────────────
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  shared_preferences: ^2.3.0
  path_provider: 2.0.15

  # ── Permissions ───────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Secure Storage ────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── GPS & Maps ────────────────────────────────────────
  geolocator: ^12.0.0
  # ── Biometrics ────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Camera & Media ────────────────────────────────────
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3

  # ── Customer Signature ────────────────────────────────
  signature: ^5.4.1

  # ── Network & Connectivity ────────────────────────────
  connectivity_plus: ^6.0.3

  # ── UI Utilities ──────────────────────────────────────
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  logger: ^2.4.0
  url_launcher: ^6.3.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_community_generator: ^3.1.0+1
  build_runner: ^2.4.11
  patrol: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - .env.example
